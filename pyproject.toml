[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirobosim-isaaclab"
version = "0.3.0a0"
description = "Isaac Lab 3.0 and Isaac Sim 6.0 adapter for UniRoboSim"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "UniRoboSim Contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["unirobosim==0.4.0a0"]

[project.entry-points."unirobosim.backends"]
isaaclab = "unirobosim_isaaclab:create_provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unirobosim_isaaclab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = ["native: requires Isaac Lab 3.0, Isaac Sim 6.0, and an NVIDIA GPU"]

[tool.coverage.run]
branch = true
source = ["unirobosim_isaaclab"]
omit = ["src/unirobosim_isaaclab/native.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
